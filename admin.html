<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель — Павел Мищенко</title><style>
*{box-sizing:border-box}body{margin:0;background:#111311;color:#f7f5ef;font:15px/1.5 Arial}.wrap{max-width:980px;margin:35px auto;padding:0 18px}h1,h2{font-family:Georgia;font-weight:normal}h1{font-size:38px}h2{font-size:28px}.panel{background:#1b1e1b;border:1px solid #343832;padding:22px;margin:18px 0}input,textarea,button{font:inherit;padding:11px;width:100%;margin:6px 0 14px;background:#101210;color:white;border:1px solid #50544c}textarea{min-height:90px}.btn{background:#c6a77b;color:#171813;border:0;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border-top:1px solid #444;padding:14px 0}.muted{color:#aaa}.status{color:#c6a77b}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{width:auto}.danger{background:#693d37;color:white;border:0}.ok{background:#526b50;color:white;border:0}.shotrow{display:flex;gap:14px;align-items:center}.shotrow img{width:70px;height:90px;object-fit:cover;object-position:top;flex:none}.shotrow div{flex:1}.shotrow button{width:auto;margin:0}@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{margin:15px auto}}
</style><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><a href="index.html">← На сайт</a><h1>Управление сайтом</h1><div id="configWarn" class="panel hidden">Сначала настройте Supabase по инструкции в README.</div>
<div id="login" class="panel"><h2>Вход администратора</h2><label>Email</label><input id="email" type="email"><label>Пароль</label><input id="password" type="password"><button class="btn" id="loginBtn">Войти</button><p id="loginMsg" class="muted"></p></div>
<div id="dashboard" class="hidden"><div class="panel"><div class="actions"><b style="margin:auto 0">Вы вошли в систему</b><button id="logoutBtn">Выйти</button></div></div>
<div class="panel"><h2>Отзывы на проверке</h2><div id="pending"></div></div>
<div class="panel"><h2>Опубликованные отзывы</h2><div id="published"></div></div>
<div class="panel"><h2>Добавить скриншоты отзывов</h2><label>Файлы (можно выбрать сразу несколько)</label><input id="shotFiles" type="file" accept="image/*" multiple><label>Подпись (необязательно, одна для всех выбранных файлов)</label><input id="shotCaption" maxlength="120"><button class="btn" id="addShots">Загрузить скриншоты</button><div id="shotMsg" class="muted"></div></div>
<div class="panel"><h2>Скриншоты отзывов на сайте</h2><div id="shots"></div></div>
<div class="panel"><h2>Добавить награду / достижение</h2><label>Название</label><input id="awardTitle"><label>Описание</label><textarea id="awardDesc"></textarea><label>Изображение</label><input id="awardImage" type="file" accept="image/*"><button class="btn" id="addAward">Сохранить награду</button><div id="awardMsg" class="muted"></div></div>
<div class="panel"><h2>Награды на сайте</h2><div id="awards"></div></div></div></div>
<script>
const configured=window.supabase&&window.SUPABASE_URL&&!window.SUPABASE_URL.includes('ВСТАВЬ')&&window.SUPABASE_ANON_KEY&&!window.SUPABASE_ANON_KEY.includes('ВСТАВЬ');
const client=configured?window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY):null;
const $=id=>document.getElementById(id);if(!configured)$('configWarn').classList.remove('hidden');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){if(!client)return;const {data:reviews}=await client.from('reviews').select('*').order('created_at',{ascending:false});$('pending').innerHTML=(reviews||[]).filter(x=>x.status==='pending').map(x=>`<div class="item"><b>${esc(x.name)} · ${x.rating}/5</b><p>${esc(x.body)}</p><div class="actions"><button class="ok" onclick="setStatus('${x.id}','published')">Опубликовать</button><button class="danger" onclick="setStatus('${x.id}','rejected')">Отклонить</button></div></div>`).join('')||'<p class="muted">Новых отзывов нет.</p>';$('published').innerHTML=(reviews||[]).filter(x=>x.status==='published').map(x=>`<div class="item"><b>${esc(x.name)} · ${x.rating}/5</b><p>${esc(x.body)}</p><button class="danger" onclick="setStatus('${x.id}','rejected')">Снять с публикации</button></div>`).join('')||'<p class="muted">Нет опубликованных отзывов.</p>';
const {data:shots}=await client.from('review_screenshots').select('*').order('created_at',{ascending:false});$('shots').innerHTML=(shots||[]).map(x=>`<div class="item shotrow"><img src="${esc(x.image_url)}" alt=""><div>${esc(x.caption||'')}</div><button class="danger" onclick="deleteShot('${x.id}')">Удалить</button></div>`).join('')||'<p class="muted">Скриншотов пока нет.</p>';
const {data:awards}=await client.from('awards').select('*').order('created_at',{ascending:false});$('awards').innerHTML=(awards||[]).map(x=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.description)}</p><button class="danger" onclick="deleteAward('${x.id}')">Удалить</button></div>`).join('')||'<p class="muted">Наград пока нет.</p>'}
window.setStatus=async(id,status)=>{await client.from('reviews').update({status}).eq('id',id);refresh()};
window.deleteAward=async id=>{if(confirm('Удалить награду?')){await client.from('awards').delete().eq('id',id);refresh()}};
window.deleteShot=async id=>{if(!confirm('Удалить скриншот?'))return;const {data}=await client.from('review_screenshots').select('image_url').eq('id',id).single();const {error}=await client.from('review_screenshots').delete().eq('id',id);if(!error&&data&&data.image_url){const i=data.image_url.indexOf('/site-media/');if(i>-1)await client.storage.from('site-media').remove([decodeURIComponent(data.image_url.slice(i+12))])}refresh()};
$('loginBtn').onclick=async()=>{const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'Вход выполнен';if(!error)show()};
$('logoutBtn').onclick=async()=>{await client.auth.signOut();show()};
function show(){client.auth.getSession().then(({data})=>{const yes=!!data.session;$('login').classList.toggle('hidden',yes);$('dashboard').classList.toggle('hidden',!yes);if(yes)refresh()})}
$('addAward').onclick=async()=>{const msg=$('awardMsg');const title=$('awardTitle').value.trim();if(!title){msg.textContent='Укажите название.';return}let image_url=null;const file=$('awardImage').files[0];if(file){const path=`${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error}=await client.storage.from('site-media').upload(path,file);if(error){msg.textContent=error.message;return}image_url=client.storage.from('site-media').getPublicUrl(path).data.publicUrl}const {error}=await client.from('awards').insert({title,description:$('awardDesc').value,image_url,is_published:true});msg.textContent=error?error.message:'Награда добавлена.';if(!error){$('awardTitle').value='';$('awardDesc').value='';$('awardImage').value='';refresh()}};
async function shrink(file){try{const bmp=await createImageBitmap(file);const max=1200;if(bmp.width<=max&&file.size<600000)return file;const k=Math.min(1,max/bmp.width);const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));return blob&&blob.size<file.size?blob:file}catch(e){return file}}
$('addShots').onclick=async()=>{const msg=$('shotMsg'),btn=$('addShots');const files=[...$('shotFiles').files];if(!files.length){msg.textContent='Выберите хотя бы один файл.';return}btn.disabled=true;let ok=0,fail=0;for(let i=0;i<files.length;i++){msg.textContent=`Загружаю ${i+1} из ${files.length}...`;try{const blob=await shrink(files[i]);const ext=blob.type==='image/png'?'png':blob.type==='image/webp'?'webp':'jpg';const path=`review-${Date.now()}-${i}-${Math.random().toString(36).slice(2,8)}.${ext}`;const {error}=await client.storage.from('site-media').upload(path,blob,{contentType:blob.type||'image/jpeg'});if(error)throw error;const url=client.storage.from('site-media').getPublicUrl(path).data.publicUrl;const {error:e2}=await client.from('review_screenshots').insert({image_url:url,caption:$('shotCaption').value.trim()||null,is_published:true});if(e2)throw e2;ok++}catch(err){fail++;console.error(err)}}btn.disabled=false;msg.textContent=`Готово: загружено ${ok}`+(fail?`, не удалось ${fail} (выберите эти файлы и загрузите ещё раз).`:'.');if(ok){$('shotFiles').value='';$('shotCaption').value='';refresh()}};
if(client)show();
</script></body></html>
